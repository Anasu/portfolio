<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Investigador — Portafolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fira+Code:wght@300..600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot-screen">
  <div class="crt-overlay"></div>
  <div class="boot-content">
    <pre id="boot-text"></pre>
    <div class="boot-progress"><div class="boot-bar" id="boot-bar"></div></div>
  </div>
</div>

<div id="desktop" class="hidden">
  <div class="taskbar-top" id="taskbar-top"></div>
  <div class="desktop-body">
    <div class="grid" id="grid"></div>
    <aside class="panel" id="panel"></aside>
  </div>
  <div class="console-bar"></div>
</div>

<div id="windows-container"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<script src="js/app.js"></script>
</body>
</html>
