<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Investigador — Portafolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fira+Code:wght@300..600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fira+Code:wght@300..600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div id="boot-screen" aria-live="polite">
  <div class="crt-overlay"></div>
  <div class="boot-content">
    <pre id="boot-text"></pre>
    <div class="boot-progress"><div class="boot-bar" id="boot-bar"></div></div>
  </div>
</div>

<div id="desktop" class="hidden" role="main" aria-label="Escritorio principal">
  <div class="taskbar-top" id="taskbar-top" role="toolbar" aria-label="Barra superior del sistema"></div>
  <div class="desktop-body">
    <div class="grid" id="grid" role="list" aria-label="Expedientes disponibles"></div>
    <aside class="panel" id="panel" role="complementary" aria-label="Panel del sistema"></aside>
  </div>
  <div class="console-bar" role="log" aria-label="Consola de comandos"></div>
</div>

<div id="windows-container" role="presentation" aria-hidden="true"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<script type="module" src="js/app.js" defer></script>
</body>
</html>
